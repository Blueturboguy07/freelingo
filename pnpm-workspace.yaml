packages:
  - 'apps/*'
  - 'packages/*'

# Expo pins its own versions (`npx expo install`, INV-PLAT-01); a release-age gate would
# fight the pin and churn the lockfile, so it is off.
minimumReleaseAge: 0

# Only these packages may run install scripts.
allowBuilds:
  '@shopify/react-native-skia': true
  esbuild: true
  simple-git-hooks: true

patchedDependencies:
  expo-modules-core@57.0.18: patches/expo-modules-core@57.0.18.patch
  expo-modules-jsi@57.1.0: patches/expo-modules-jsi@57.1.0.patch
  expo-speech-recognition@57.0.0: patches/expo-speech-recognition@57.0.0.patch
  expo-speech@57.0.3: patches/expo-speech@57.0.3.patch
