name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 24 for the built-in node:sqlite used by the schema tests (no native build).
  NODE_VERSION: '24'

jobs:
  checks:
    name: lint + typecheck + unit/property tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile — INV-PLAT-01)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + property tests
        # B20: the default reporter's per-task rendering amplified worker RPC stalls on
        # the slowest hosted runners. The dot reporter keeps failure detail and the final
        # Vitest duration without repainting every completed task. Serial files keep one
        # worker's task update from waiting behind concurrent slow property updates. Bash
        # `time` records wall/user/sys time so a slow green run remains measurable.
        run: time pnpm test -- --reporter=dot --no-file-parallelism

      - name: Invariant registry is the verbatim corpus copy, not hand-edited
        run: pnpm invariants:check

      - name: Coverage map — the ownership gates themselves work
        run: node --experimental-strip-types scripts/coverage-map.ts --self-test

      - name: Coverage map — every owned invariant id has an owning test
        run: pnpm test:coverage-map

  golden-migrations:
    # Its own job, not a line in `pnpm test`, for two reasons. A migration is the one
    # piece of code that runs exactly once per device and can never be re-run if it was
    # wrong, so its failure must be the name of a red job rather than four lines inside a
    # 200-test summary. And the fixtures are committed binaries: the checkout step below
    # is the only thing that has to be right for the corpus to be the corpus.
    name: golden-DB migrations (INV-PER-03, INV-PACK-35)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile — INV-PLAT-01)
        run: pnpm install --frozen-lockfile

      - name: The committed corpus is present and was not regenerated by this run
        run: |
          set -euo pipefail
          test -d packages/schema/fixtures/golden
          ls -l packages/schema/fixtures/golden
          # FREELINGO_REBUILD_GOLDEN is the maintainer's rebuild switch. If CI ever set
          # it, the job would rewrite the expectations it exists to check and pass for
          # free, so the job refuses to run with it set.
          test -z "${FREELINGO_REBUILD_GOLDEN:-}"

      - name: Migrate every committed fixture forward
        run: pnpm test:golden-migrations

      - name: The corpus is unchanged after the run (a test must not rewrite its oracle)
        run: git diff --exit-code -- packages/schema/fixtures

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history and working tree
        run: |
          gitleaks git . --config .gitleaks.toml --no-banner --redact
          gitleaks dir . --config .gitleaks.toml --no-banner --redact
