name: mutation

# Nightly Stryker on packages/core. A green unit suite that survives every mutant is not
# a suite.
#
# At P0 this job reported and was allowed to fail. At P1 the plan makes it a gate —
# "Stryker score >= threshold nightly" — so `continue-on-error` is gone and the threshold
# lives in stryker.config.json (`thresholds.break`), which is what actually fails the run.
#
# The job also PRINTS THE SCORE. "The mutation job is green" is not a measurement: a run
# whose config stopped matching any file is green, and so is a run whose threshold was
# quietly lowered. The summary step below writes the score, the threshold, and the number
# of mutants in each state into the run summary, so the number a report quotes can be read
# off the run rather than taken on trust.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: stryker (packages/core)
    runs-on: ubuntu-latest
    # A cold run over 9,802 mutants is hours, and the dry run alone is minutes because it
    # collects per-test coverage over 222 fast-check properties. The incremental cache
    # below makes the steady state small; this timeout is sized for the cold run that
    # follows a cache miss, not for the steady state.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Incremental mode re-tests only the mutants whose file or covering tests changed.
      # `restore-keys` is what makes it work at all: the exact key carries the sha, so it
      # never hits, and the prefix match picks up the previous night's report.
      - name: Restore the incremental report
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      # A mutate glob that matches nothing produces a 100% score and a green tick, which
      # is the most expensive way this workflow could lie. Counted before Stryker runs.
      - name: The mutate globs match engine sources
        run: |
          set -euo pipefail
          count=$(find packages/core/src -name '*.ts' \
            ! -name '*.test.ts' ! -name 'index.ts' ! -path 'packages/core/src/journey/*' | wc -l)
          echo "engine sources in scope: $count"
          test "$count" -ge 3

      - name: Run Stryker
        run: pnpm exec stryker run stryker.config.json

      - name: Record the score
        if: always()
        run: |
          set -euo pipefail
          report=reports/mutation/mutation.json
          if [ ! -f "$report" ]; then
            echo "no mutation report at $report — Stryker did not get far enough to score" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The JS below is single-quoted on purpose: its ${...} are template literals for
          # node, not shell expansions.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("reports/mutation/mutation.json", "utf8"));
            const config = JSON.parse(readFileSync("stryker.config.json", "utf8"));
            const mutants = Object.values(report.files).flatMap((f) => f.mutants);
            const count = (status) => mutants.filter((m) => m.status === status).length;
            const killed = count("Killed") + count("Timeout");
            const survived = count("Survived");
            const noCoverage = count("NoCoverage");
            // TWO scores, because they are different numbers and only one is the gate.
            // Stryker breaks on the TOTAL score, which counts a mutant no test covers as
            // survived; the covered score ignores those and always reads higher. Printing
            // only the covered one would quote a figure the threshold never sees.
            const total = killed + survived + noCoverage;
            const score = total === 0 ? 0 : (killed / total) * 100;
            const coveredDenominator = killed + survived;
            const covered = coveredDenominator === 0 ? 0 : (killed / coveredDenominator) * 100;
            const rows = ["Killed", "Timeout", "Survived", "NoCoverage", "CompileError", "RuntimeError", "Ignored"]
              .map((s) => `| ${s} | ${count(s)} |`).join("\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              `## Mutation score: **${score.toFixed(2)}%**`,
              ``,
              `threshold (\`thresholds.break\`, compared against THIS number): **${config.thresholds.break}%**`,
              `covered score (ignores uncovered mutants, always higher): ${covered.toFixed(2)}%`,
              `mutants: ${mutants.length} across ${Object.keys(report.files).length} files`,
              ``,
              `| state | n |`,
              `| --- | --- |`,
              rows,
              ``,
            ].join("\n"));
            console.log(`mutation score ${score.toFixed(2)}% (covered ${covered.toFixed(2)}%, threshold ${config.thresholds.break}%)`);
          '

      - name: Save the incremental report
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
