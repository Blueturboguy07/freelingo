name: mutation

# Nightly Stryker on packages/core. A green unit suite that survives every mutant is not
# a suite. Allowed to fail for now: the threshold becomes a gate at P1, when the engine
# modules exist and the score means something.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: stryker (packages/core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Stryker
        run: pnpm exec stryker run stryker.config.json

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 14
