name: pack-ci

# tools/coursekit: the content pipeline. Nothing ships to a learner that did not come
# through `coursekit validate`.
#
# Three layers:
#
#   coursekit        lint + unit tests, always
#   pipeline-ready   counts the registered G-stages and validators (ten seconds, Linux)
#   build-es ───────▶ validate-es          both gated on pipeline-ready
#
# `pipeline-ready` is `native-e2e.yml`'s `flows-present` applied to this pipeline, and it
# exists for the same reason. `maestro test` over an empty directory exits 0; `coursekit
# build es` over an empty registry exits 2, which is the right answer but makes every
# unrelated PR red for the weeks the G-lanes are landing. So the registry is counted
# first on a cheap runner, the two long jobs are SKIPPED rather than run over nothing,
# and the skip is printed into the job summary with the ids that are still missing. The
# artefact upload then uses `if-no-files-found: error`, so `es-pack-<sha>` can never be
# an empty archive that reads as a successful build.

on:
  push:
    branches: [main]
    paths:
      - 'tools/coursekit/**'
      - 'content/**'
      - 'packages/schema/keys/**'
      - '.github/workflows/pack-ci.yml'
  pull_request:
    paths:
      - 'tools/coursekit/**'
      - 'content/**'
      - 'packages/schema/keys/**'
      - '.github/workflows/pack-ci.yml'
  workflow_dispatch:

concurrency:
  group: pack-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # THE INGEST CAP IS NOT HERE ANY MORE, ON PURPOSE. It used to be `COURSEKIT_MAX_PAIRS:
  # '200000'`, passed as `--set max_pairs=...`, while `config/g0.py MAX_PAIRS_DEFAULT`
  # said 2,000,000 — so the number the pipeline shipped with had never been run and the
  # number that had been run was in a workflow file. Whichever of the two is wrong, the
  # bug is that there were two. The cap is now one constant in `config/g0.py`, this job
  # exercises the default, and the measurements behind the value are in
  # `docs/owned/p2fix-ledger-freeze.json`.
  #
  # Named here because two jobs assert against it and one of them is a shell script.
  AUDIO_BUDGET_MB: '120'
  # Where `build-es` puts the Kokoro weights. This is the only workflow that bakes:
  # `pack-bake.yml` was deleted at the P2 fix round (docs/ci.md), because a dispatch on a
  # fresh checkout has no G7 output to bake.
  COURSEKIT_KOKORO_WEIGHTS: ${{ github.workspace }}/.kokoro

jobs:
  coursekit:
    name: coursekit lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/coursekit
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/coursekit/uv.lock

      - name: Sync (locked)
        run: uv sync --locked

      # INV-AUD-08 clause 1 — "every packed clip MEASURES within tolerance of the target"
      # — is a statement about a real Opus file, and this job deliberately does not install
      # the `tts` group or the 354 MB of Kokoro weights. opus-tools is one apt line and it
      # is what lets `test_inv_aud_08_a_synthetic_clip_measures_on_the_decoded_file` run the
      # shipping chain (master -> encode -> decode -> measure) on a synthetic voice here.
      # Without it the only CI-reachable guard for that clause was a grep over g8_bake.py.
      - name: Install opus-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opus-tools

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        # COURSEKIT_REQUIRE_OPUS_TOOLS turns "opus-tools is missing" from a skip into a
        # failure. A guard that silently skips when its tool is absent is the failure it
        # was written to prevent, one level up.
        env:
          COURSEKIT_REQUIRE_OPUS_TOOLS: '1'
        run: uv run pytest

      - name: The INV-AUD-08 audio guard actually ran (no skips)
        env:
          COURSEKIT_REQUIRE_OPUS_TOOLS: '1'
        run: uv run pytest -rs --no-header -k 'inv_aud_08 or inv_pack_15'

      - name: CLI smoke — every stage is reachable
        run: uv run coursekit --help

  pipeline-ready:
    name: pipeline-ready (which stages and validators exist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.count.outputs.ready }}
      missing: ${{ steps.count.outputs.missing }}
    defaults:
      run:
        working-directory: tools/coursekit
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/coursekit/uv.lock

      - name: Sync (locked)
        run: uv sync --locked

      - name: Count the registry
        id: count
        run: |
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from coursekit.config import BUILD_STAGE_IDS, VALIDATOR_IDS
          from coursekit.stages import STAGES
          from coursekit.validators import VALIDATORS

          missing = [
              *(f"stage:{s}" for s in STAGES.missing(BUILD_STAGE_IDS)),
              *(f"validator:{v}" for v in VALIDATORS.missing(VALIDATOR_IDS)),
          ]
          print(f"ready={'false' if missing else 'true'}")
          print(f"missing={' '.join(missing) or '(none)'}")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("## pipeline-ready\n\n")
              handle.write(
                  f"- stages registered: {len(STAGES.ids())}/{len(BUILD_STAGE_IDS)}\n"
                  f"- validators registered: {len(VALIDATORS.ids())}/{len(VALIDATOR_IDS)}\n"
              )
              if missing:
                  handle.write(
                      "\n**`build-es` and `validate-es` are SKIPPED**: the pipeline is "
                      "incomplete, and a pack built over an empty registry is not a "
                      "pack. Still missing:\n\n"
                  )
                  handle.writelines(f"- `{item}`\n" for item in missing)
              else:
                  handle.write("\nThe pipeline is complete; the es pack jobs run.\n")
          PY

  build-es:
    name: build-es (G0-G9, capped ingest)
    needs: pipeline-ready
    if: needs.pipeline-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/coursekit
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/coursekit/uv.lock

      # `nlp` and `lm` are the two groups CI carries: spaCy with the URL-pinned
      # es_core_news_md wheel, and KenLM pinned to a commit archive. `align` (torch +
      # transformers) and `tts` (onnxruntime + model downloads) are gigabytes and do not
      # fit this job — a stage that needs one exits 3 with the install command rather
      # than degrading to a worse aligner or a system voice.
      # `tts` as well, because G8 runs inside this job now that `pack-bake.yml` is gone.
      # The deps lane kept it out of `[tool.uv] default-groups` so the 20-minute
      # `coursekit` job stays 20 minutes; THIS job has 60 and its product is a pack, and
      # a pack contains audio. A stage whose group is absent exits 3 rather than
      # degrading, so without this the build stops at G8 and the artefact is not a pack.
      - name: Sync nlp + lm + tts (locked)
        run: uv sync --locked --group nlp --group lm --group tts

      - name: Install opus-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opus-tools

      # G2's input. hermitdave is on the ingest allow-list (CC BY-SA-4.0, `shippable`,
      # attribution required) and `resolve()` refuses it if it ever leaves that list, so
      # fetching it here cannot smuggle anything past INV-PACK-13. It is fetched rather
      # than vendored because it is 658,626 bytes of third-party share-alike data and the
      # repo ships code and original content only.
      - name: Fetch the es frequency list (hermitdave, CC BY-SA-4.0)
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/build/es/sources"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/es_50k.txt" \
            https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/es/es_50k.txt
          wc -l "$dir/es_50k.txt"

      - name: Cache the pinned Kokoro weights
        id: weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.kokoro
          key: kokoro-model-files-v1.0

      - name: Download the pinned Kokoro weights
        if: steps.weights.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$COURSEKIT_KOKORO_WEIGHTS"
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -fL --retry 3 -o "$COURSEKIT_KOKORO_WEIGHTS/kokoro-v1.0.onnx" "$base/kokoro-v1.0.onnx"
          curl -fL --retry 3 -o "$COURSEKIT_KOKORO_WEIGHTS/voices-v1.0.bin" "$base/voices-v1.0.bin"

      - name: Disk before
        run: df -h .

      # V8 BLOCKS A RUN THAT CHECKED NOTHING (INV-PACK-14), so `build-es` has to bring a
      # language engine or `validate-es` cannot exit 0 for any content whatsoever. Until
      # this step existed the job ran `coursekit build es` with no engine option at all,
      # G6 recorded `grammar_engine: none` the way its docstring says it must, and V8
      # read "0 errors from nothing". That was invisible while G5 was failing one stage
      # earlier; it is the next thing that stops the build the moment the candidates land.
      #
      # LanguageTool is a Java sidecar. It is on the ingest allow-list already
      # (grammar_rules / languagetool / shippable / LGPL-2.1-or-later), Java is on
      # ubuntu-latest, and the server is one jar. KenLM stays absent on purpose: the pip
      # package ships the query module only, training needs binaries built from source,
      # and `engines/kenlm.py` refuses to invent an ARPA. With the sidecar up and no KenLM
      # model, G6 degrades to `grammar_only`, names what it lost, and V8 does not block -
      # which is the honest state and one the suite already has a name for.
      #
      # THE URL IS THE SERVER BASE, NOT AN ENDPOINT: LanguageToolEngine appends
      # `/v2/languages` and `/v2/check` itself, so passing `.../v2/check` fails on a 404
      # for `/v2/check/v2/languages`.
      - name: Start the LanguageTool sidecar (LGPL-2.1-or-later)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o LanguageTool-6.6.zip https://languagetool.org/download/LanguageTool-6.6.zip
          unzip -q LanguageTool-6.6.zip
          nohup java -cp LanguageTool-6.6/languagetool-server.jar \
            org.languagetool.server.HTTPServer --port 8081 > languagetool.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8081/v2/languages" > /dev/null; then
              echo "languagetool is up"; break
            fi
            sleep 2
          done
          # The probe V8's engine record rests on: Spanish has a spell checker as well as
          # grammar rules, so a `spellcheck_engine: none` on es is a broken sidecar, not a
          # property of the language (which it IS for ja - 735 grammar rules, no speller).
          curl -fsS -X POST -d "language=es&text=Yo tengo un qwzxvb grande." \
            "http://localhost:8081/v2/check" | grep -q MORFOLOGIK_RULE_ES
          echo "spell checker confirmed"

      - name: Build es (G0-G9)
        run: uv run coursekit build es --set languagetool_url=http://localhost:8081

      # The gap list this build produced, as the authoring lanes read it. Uploaded, never
      # asserted against the committed `content/es/authoring/gap-brief.jsonl`: G0 reads a
      # LIVE Tatoeba export that rebuilds every Saturday 06:30 UTC, so the ledger legitimately
      # moves between runs and a digest gate here would be a weekly red for a correct build.
      # What it IS for: diff this artefact against the committed brief and you know whether
      # the 9,800 authored candidates are still keyed to slots that exist. A stale one is not
      # silent either way - G5 rejects every candidate written against it as `stale_ledger`.
      #
      # `continue-on-error` and `if-no-files-found: warn`, against this repo's usual rule,
      # because this step runs on `always()`: a build that died in G0 has no gap list to
      # print, `coursekit gaps` exits 3 saying so, and a diagnostic that turns one red job
      # into two red jobs hides which failure came first.
      - name: The gap brief this build produced
        if: always()
        continue-on-error: true
        run: uv run coursekit gaps es --no-write > "$GITHUB_WORKSPACE/gap-brief-built.jsonl"

      - name: Upload the gap brief
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: es-gap-brief-${{ github.sha }}
          path: gap-brief-built.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Assert the audio bank is inside the declared budget
        run: |
          set -euo pipefail
          bank="../../build/es/g8"
          if [ ! -d "$bank" ]; then
            echo "::error::G8 reported success and wrote no audio directory at $bank"
            exit 1
          fi
          bytes=$(du -sb "$bank" | cut -f1)
          budget=$((AUDIO_BUDGET_MB * 1000 * 1000))
          echo "audio bank: $bytes bytes, budget ${AUDIO_BUDGET_MB} MB ($budget bytes)"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::error::the es audio bank is $bytes bytes, over the ${AUDIO_BUDGET_MB} MB budget (INV-PACK-15)"
            exit 1
          fi
          if [ "$bytes" -eq 0 ]; then
            echo "::error::the es audio bank is empty; a budget check that passes on 0 bytes checks nothing"
            exit 1
          fi

      - name: Draw the reviewer sample (300 items, recorded seed)
        run: uv run coursekit sample es

      - name: Sign the manifest
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PACK_SIGNING_KEY:-}" ]; then
            echo "::notice::PACK_SIGNING_KEY is not available to this run (it is not exposed to pull requests from forks); the pack is built unsigned and a device would report it as \`unverified\`."
            exit 0
          fi
          uv run coursekit sign es

      # `retention-days: 7`, raised from 1 at the P2 fix integration. This artefact is
      # `validate-es`'s input AND, since `pack-bake.yml` was deleted, the only place the
      # baked voice bank (`g8/bank/`, `g8/clips.jsonl`) is downloadable from. One day made
      # a bank re-derivable only by re-running the build; docs/ci.md named that as the one
      # thing the deletion did not fix, and this is the fix.
      - name: Upload the build tree for validate-es
        uses: actions/upload-artifact@v4
        with:
          name: es-build-${{ github.sha }}
          path: build/es
          if-no-files-found: error
          retention-days: 7

  validate-es:
    name: validate-es (V1-V12 + F1-F5)
    needs: [pipeline-ready, build-es]
    if: needs.pipeline-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/coursekit
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: tools/coursekit/uv.lock

      - name: Sync nlp + lm (locked)
        run: uv sync --locked --group nlp --group lm

      - name: Download the build tree
        uses: actions/download-artifact@v4
        with:
          name: es-build-${{ github.sha }}
          path: build/es

      # Exit 0 only. 2 means a validator nobody wrote, 3 means one that could not run,
      # 4 means one that ran and failed — and all three report zero findings, which is
      # what a green validator also reports.
      - name: Validate es
        run: uv run coursekit validate es

      - name: Assert V1-V4 at 100% and the whole suite green
        run: |
          uv run python - <<'PY'
          import json
          import sys

          from coursekit.config.validate import HARD_GATE_VALIDATOR_IDS
          from coursekit.validators.report import read_report, report_path, summarise

          report = read_report(report_path("es"))
          summary = summarise(report)
          print(json.dumps(summary, indent=2))

          problems = []
          if not report["hard_gate"]["passed"]:
              problems.append(f"the hard gate {list(HARD_GATE_VALIDATOR_IDS)} is not 100%")
          if summary["not_run"]:
              problems.append(f"{summary['not_run']} validator(s) did not run")
          if report["status"] != "green":
              problems.append(f"suite status is {report['status']}")
          if summary["declared"] != summary["green"]:
              problems.append(f"only {summary['green']}/{summary['declared']} validators are green")

          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY

      - name: Collect the pack artefacts
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/es-pack"
          mkdir -p "$out"
          # `build/` is at the repository root: `coursekit.artifacts.build_root()`
          # resolves it from the package's own path, not from the working directory.
          #
          # CROSS-LANE CONTRACT, RESOLVED AT P2 INTEGRATION. This lane wrote down
          # `g9/es.pack` as a guess and recorded the guess in
          # docs/owned/p2-validate-ci.json -> crossLaneContracts, because
          # config/package.py was empty and p2-g9-package-loader had not landed. G9
          # calls it `pack.sqlite` (config/g9.py PACK_DB_FILENAME), so the name is
          # corrected here rather than left to fail this step on the first real build.
          # `g9/manifest.json` was already safe: MANIFEST_FILENAME and PACK_STAGE_ID are
          # both real constants.
          root="$GITHUB_WORKSPACE/build/es"
          for file in "$root/g9/pack.sqlite" "$root/g9/manifest.json" \
                      "$root/validator-report.json" "$root/sample-300.jsonl" \
                      "$root/sample-summary.json" "$root/runlog.jsonl"; do
            if [ -f "$file" ]; then
              cp "$file" "$out/"
            else
              echo "::error::$file is missing; the pack artefact would be incomplete"
              exit 1
            fi
          done
          ls -l "$out"

      - name: Upload es-pack-<sha>
        uses: actions/upload-artifact@v4
        with:
          name: es-pack-${{ github.sha }}
          path: es-pack
          if-no-files-found: error
