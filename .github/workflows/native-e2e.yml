name: native-e2e

# Behaviour flows, native snapshot baselines and a11y-tree walks on a real simulator and
# a real emulator, plus the two build gates that only a native toolchain can prove.
#
# macOS runners are free on a public repo and have no build-minute cap, but wall-clock is
# the budget: a cold Xcode build plus a Maestro pass is tens of minutes, so the flow
# guard runs first on a cheap Linux runner and the device jobs `needs:` it.
#
# Only CI writes e2e/artifacts/. A screenshot without a CI URL is not evidence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Maestro requires Java 17+ (deep/09); temurin 21 is the current LTS.
  JAVA_VERSION: '21'
  # Named config: the toolchain and the simulator the iOS baselines are recorded against.
  #
  # Xcode is PINNED, and to an older one than the image default suggests, because the
  # newest is measured-broken for this dependency set. On Xcode 26.2 (17C52, Apple Swift
  # 6.2.3) the ExpoModulesJSI xcframework phase fails with two errors, exit 65:
  #   RuntimeScheduler.h:53:26: 'RuntimeScheduler' cannot be annotated with either
  #   SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED because it is not returning a
  #   SWIFT_SHARED_REFERENCE type
  # (again at :61). That is expo-modules-jsi@57.1.0's own header against a tightened C++
  # interop check in Swift 6.2; the package builds that framework from source at pod time,
  # so there is no prebuilt slice to fall back to. Reproduced on this repo 2026-09-11 and
  # isolated to a 15-line standalone repro with no Expo and no React Native.
  #
  # 16.4 is the macos-15 image default (Swift 6.1) and predates the check. Raise this pin
  # the moment expo ships a fixed expo-modules-jsi — do not raise it hopefully.
  XCODE_APP: '/Applications/Xcode_16.4.app'
  # Xcode 16.4 carries no iOS 26 runtime, so the baselines are on the newest it does have.
  SIMULATOR_NAME: 'iPhone 16'
  SIMULATOR_OS: 'iOS-18-5'
  # Named config: the emulator the Android baselines are committed against.
  ANDROID_API_LEVEL: '34'
  ANDROID_ARCH: 'x86_64'
  ANDROID_TARGET: 'google_apis'
  # The one place the flow directory is named.
  FLOW_DIR: 'e2e/flows'
  # Both device jobs build RELEASE, so `__DEV__` is false and a `__DEV__`-only diagnostics
  # surface is invisible to the job that gates it (measured 2026-09-11: the flow reached
  # app-title, long-pressed it, and failed on `dev-diagnostics is visible`). Metro inlines
  # EXPO_PUBLIC_* at bundle time, so this must be set on the BUILD step, not just the
  # Maestro step, and a build without it does not contain the branch at all.
  # apps/mobile/src/dev/diagnosticsEnabled.ts owns the rule; a testkit gate holds the two
  # together.
  EXPO_PUBLIC_FREELINGO_E2E: '1'

jobs:
  # ---------------------------------------------------------------------------
  # A `maestro test` over an empty directory exits 0. That is the single most
  # expensive way this workflow could lie: two device jobs, twenty minutes of build
  # each, a green tick, and nothing tested. So the flows are counted first, on a
  # 10-second Linux runner, and both device jobs `needs:` this one.
  #
  # It is EXPECTED to fail until the persistence branch lands e2e/flows/p0-db-path.yaml.
  # Red here means "no flows", which is the truth. Do not add an `if:` to skip it.
  # ---------------------------------------------------------------------------
  flows-present:
    name: flows exist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      - name: Count Maestro flows
        id: count
        run: |
          set -euo pipefail
          if [ ! -d "$FLOW_DIR" ]; then
            echo "::error::$FLOW_DIR does not exist. native-e2e has nothing to run." >&2
            exit 1
          fi
          # A flow is a YAML file with an `appId:` header. README.md and any other prose
          # in the directory is not a flow and must not be counted as one.
          COUNT=0
          while IFS= read -r flow; do
            if grep -qE '^appId:' "$flow"; then
              echo "flow: $flow"
              COUNT=$((COUNT + 1))
            else
              echo "::warning::$flow has no appId: header; not counted as a flow"
            fi
          done < <(find "$FLOW_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no Maestro flows in $FLOW_DIR. A green e2e run with no flows is a lie." >&2
            exit 1
          fi
          echo "$COUNT flow(s) to run on each platform"

  # ---------------------------------------------------------------------------
  ios-simulator:
    name: iOS simulator
    needs: flows-present
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Job-level, not set in a step: every `if: always()` step below reads it, including
      # the ones that run after an early failure.
      ARTIFACT_DIR: e2e/artifacts/${{ github.sha }}/ios
    steps:
      - uses: actions/checkout@v5

      # Every xcrun/xcodebuild in this job, including the ones inside `expo run:ios`,
      # resolves through DEVELOPER_DIR. See XCODE_APP above for why it is pinned low.
      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image. The pin is stale — read the note on XCODE_APP before moving it." >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Toolchain in use (recorded with the artefacts)
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro and Java versions (recorded with the artefacts)
        run: |
          set -euo pipefail
          java -version
          maestro --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Boot the simulator
        timeout-minutes: 15
        env:
          WANT_NAME: ${{ env.SIMULATOR_NAME }}
          WANT_OS: ${{ env.SIMULATOR_OS }}
        run: |
          set -euo pipefail
          # Prefer the device the snapshot baselines were recorded against. Runner images
          # rotate their bundled runtimes, so fall back to any available iPhone rather
          # than failing the whole job on an image bump — and say which one was used, so a
          # snapshot diff is never mistaken for a code change.
          cat > /tmp/pick-simulator.py <<'PY'
          import json, os, sys

          want_name = os.environ["WANT_NAME"]
          want_os = os.environ["WANT_OS"]
          devices = json.load(sys.stdin)["devices"]

          exact = same_name = any_iphone = None
          for runtime, items in devices.items():
              short = runtime.rsplit(".", 1)[-1]
              for d in items:
                  pick = (d["udid"], "{} @ {}".format(d["name"], short))
                  if d["name"] == want_name and want_os in runtime:
                      exact = exact or pick
                  elif d["name"] == want_name:
                      same_name = same_name or pick
                  elif d["name"].startswith("iPhone"):
                      any_iphone = any_iphone or pick

          chosen = exact or same_name or any_iphone
          if chosen is None:
              sys.exit("no available iPhone simulator on this runner")
          print(chosen[0])
          print(chosen[1])
          PY
          xcrun simctl list devices available --json | python3 /tmp/pick-simulator.py > /tmp/simulator.txt
          UDID=$(sed -n 1p /tmp/simulator.txt)
          CHOSEN=$(sed -n 2p /tmp/simulator.txt)
          echo "Booting ${CHOSEN} (${UDID}); baselines were recorded on ${WANT_NAME} (${WANT_OS})"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "SIMULATOR_CHOSEN=$CHOSEN" >> "$GITHUB_ENV"

          # `simctl boot` is idempotent-ish: it errors if the device is already booted,
          # which is not a failure. Anything else is.
          xcrun simctl boot "$UDID" 2>/tmp/boot.err || {
            grep -q "Unable to boot device in current state: Booted" /tmp/boot.err || {
              cat /tmp/boot.err >&2; exit 1; }
            echo "already booted"
          }

          # NEVER use a bare `simctl bootstatus -b`: on a cold runner it can wait forever
          # and burn the whole 90-minute job (observed: 20+ minutes with no output, run
          # 34615268235). Poll the device state with our own ceiling instead, so a slow
          # image bump fails fast and legibly rather than hanging.
          DEADLINE=$(( SECONDS + 600 ))
          until [ "$(xcrun simctl list devices | grep "$UDID" | grep -c '(Booted)')" -eq 1 ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "simulator $CHOSEN ($UDID) did not reach Booted within 600s" >&2
              xcrun simctl list devices | grep "$UDID" >&2 || true
              exit 1
            fi
            sleep 5
          done
          echo "booted after ${SECONDS}s"

      - name: Open Simulator.app so there is a window server
        run: |
          set -euo pipefail
          # `simctl io screenshot` and Maestro's view hierarchy both need the device to
          # own a DISPLAY, and a headless runner has none until Simulator.app opens it:
          # without this, screenshots fail with "Error creating the image" forever, not
          # just right after boot (observed: run 34617438245 immediately, run
          # 34617892776 still failing at 300 s).
          open -a Simulator --args -CurrentDeviceUDID "$SIMULATOR_UDID"
          sleep 15

      - name: Prepare the artefact directory for this sha
        run: mkdir -p "$ARTIFACT_DIR"

      # SDK 57's prebuild help lists `--no-clean`, not `--clean`: recreating the native
      # folders is now the default and `--clean` spells it out (verified accepted, twice,
      # on 2026-09-11). Spelled out on purpose — an incremental prebuild is how a stale
      # native tree survives a config change.
      - name: Prebuild the native project (generated, never committed — INV-PLAT-02)
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform ios

      - name: Build and install on the booted simulator
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # Release, not Debug: Release embeds the JS bundle in the app, which is what
          # makes `--no-bundler` correct. A Debug build with no Metro launches to a red
          # screen and every flow fails on the first assertion for the wrong reason.
          npx expo run:ios \
            --device "$SIMULATOR_UDID" \
            --no-bundler \
            --configuration Release

      - name: maestro test ${{ env.FLOW_DIR }}
        run: |
          set -euo pipefail
          # See docs/ci.md for the measured screenshot contract. In short: a flow CANNOT
          # write a file into e2e/artifacts/ — `takeScreenshot` is always resolved inside
          # Maestro's own run directory — so the run directory is pointed at the artefact
          # directory instead, and the next step lifts the PNGs out of it.
          #
          # Never add --flatten-debug-output: on 2.10.0 it makes the run write into $HOME
          # and never creates --test-output-dir at all (measured 2026-09-11).
          maestro test "$FLOW_DIR" \
            --output "$ARTIFACT_DIR/report.xml" \
            --format junit \
            --test-output-dir "$ARTIFACT_DIR/maestro" \
            -e PLATFORM=ios

      - name: Collect the screenshots and prove the run was not empty
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -s "$ARTIFACT_DIR/report.xml" ]; then
            echo "::error::maestro wrote no JUnit report to $ARTIFACT_DIR/report.xml" >&2
            exit 1
          fi

          # Maestro buries each PNG at
          #   $ARTIFACT_DIR/maestro/<run timestamp>/<flow>/takeScreenshot/<name>.png
          # A timestamp in the path makes every artefact a different shape, so the frames
          # are copied up to one flat, stable directory named <flow>-<name>.png. The copy
          # is what a reviewer opens; the tree underneath stays for the logs.
          SHOTS_DIR="$ARTIFACT_DIR/screenshots"
          mkdir -p "$SHOTS_DIR"
          COUNT=0
          while IFS= read -r shot; do
            flow=$(basename "$(dirname "$(dirname "$shot")")")
            cp "$shot" "$SHOTS_DIR/${flow}-$(basename "$shot")"
            COUNT=$((COUNT + 1))
          done < <(find "$ARTIFACT_DIR/maestro" -name '*.png' 2>/dev/null | LC_ALL=C sort)

          echo "screenshots collected: $COUNT"
          ls -la "$SHOTS_DIR"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no screenshot came out of the Maestro run directory; every flow must end in a takeScreenshot" >&2
            exit 1
          fi

      - name: Record what actually ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "sha=${{ github.sha }}"
            echo "platform=ios"
            echo "simulator_requested=${{ env.SIMULATOR_NAME }} (${{ env.SIMULATOR_OS }})"
            echo "simulator_used=${SIMULATOR_CHOSEN:-unknown}"
            echo "udid=${SIMULATOR_UDID:-unknown}"
            echo "xcode=$(xcodebuild -version 2>/dev/null | tr '\n' ' ' || echo unknown)"
            echo "flows=${{ needs.flows-present.outputs.count }}"
            echo "maestro=$(maestro --version 2>/dev/null || echo 'not installed')"
          } > "$ARTIFACT_DIR/runner.txt"
          cat "$ARTIFACT_DIR/runner.txt"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 refuses a duplicate name, so the two device jobs are
          # suffixed rather than both called e2e-<sha>.
          name: e2e-${{ github.sha }}-ios
          path: e2e/artifacts/${{ github.sha }}/ios/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  android-emulator:
    name: Android emulator
    needs: flows-present
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARTIFACT_DIR: e2e/artifacts/${{ github.sha }}/android
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Enable KVM for the x86_64 emulator
        run: |
          set -euo pipefail
          # Without this udev rule the hardware-accelerated x86_64 image falls back to
          # software rendering and the AVD takes longer to boot than the job allows.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro and Java versions (recorded with the artefacts)
        run: |
          set -euo pipefail
          java -version
          maestro --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare the artefact directory for this sha
        run: mkdir -p "$ARTIFACT_DIR"

      - name: Prebuild the native project (generated, never committed — INV-PLAT-02)
        working-directory: apps/mobile
        run: npx expo prebuild --clean --platform android

      - name: Build, install and run the flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          target: ${{ env.ANDROID_TARGET }}
          # No AVD cache yet, so the AVD is created fresh every run; `force-avd-creation`
          # is only meaningful once one exists, and setting it here would imply a cache
          # that does not.
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # `set -eu`, NOT `set -euo pipefail`. This action runs `script:` with
            # /usr/bin/sh — dash on ubuntu-latest — which has no `-o pipefail` and exits
            # 2 on the very first line: "sh: 1: set: Illegal option -o pipefail"
            # (measured, run 34634498819: the step died before adb, and the job then
            # failed on a missing JUnit report, which looks like an emulator problem and
            # is not one). Every other `run:` in this workflow is bash and keeps pipefail.
            set -eu
            adb devices
            # Release for the same reason as iOS: the bundle is embedded, so --no-bundler
            # is honest. Expo's Android template signs release with the debug keystore,
            # so this needs no secret.
            (cd apps/mobile && npx expo run:android --no-bundler --variant release)
            # See the iOS job and docs/ci.md: the run directory goes under ARTIFACT_DIR
            # and a later step lifts the PNGs out. Never --flatten-debug-output.
            maestro test "$FLOW_DIR" \
              --output "$ARTIFACT_DIR/report.xml" \
              --format junit \
              --test-output-dir "$ARTIFACT_DIR/maestro" \
              -e PLATFORM=android

      - name: Collect the screenshots and prove the run was not empty
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ ! -s "$ARTIFACT_DIR/report.xml" ]; then
            echo "::error::maestro wrote no JUnit report to $ARTIFACT_DIR/report.xml" >&2
            exit 1
          fi

          # Maestro buries each PNG at
          #   $ARTIFACT_DIR/maestro/<run timestamp>/<flow>/takeScreenshot/<name>.png
          # A timestamp in the path makes every artefact a different shape, so the frames
          # are copied up to one flat, stable directory named <flow>-<name>.png. The copy
          # is what a reviewer opens; the tree underneath stays for the logs.
          SHOTS_DIR="$ARTIFACT_DIR/screenshots"
          mkdir -p "$SHOTS_DIR"
          COUNT=0
          while IFS= read -r shot; do
            flow=$(basename "$(dirname "$(dirname "$shot")")")
            cp "$shot" "$SHOTS_DIR/${flow}-$(basename "$shot")"
            COUNT=$((COUNT + 1))
          done < <(find "$ARTIFACT_DIR/maestro" -name '*.png' 2>/dev/null | LC_ALL=C sort)

          echo "screenshots collected: $COUNT"
          ls -la "$SHOTS_DIR"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no screenshot came out of the Maestro run directory; every flow must end in a takeScreenshot" >&2
            exit 1
          fi

      - name: Record what actually ran
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "sha=${{ github.sha }}"
            echo "platform=android"
            echo "api_level=${{ env.ANDROID_API_LEVEL }}"
            echo "arch=${{ env.ANDROID_ARCH }}"
            echo "target=${{ env.ANDROID_TARGET }}"
            echo "flows=${{ needs.flows-present.outputs.count }}"
            echo "maestro=$(maestro --version 2>/dev/null || echo 'not installed')"
          } > "$ARTIFACT_DIR/runner.txt"
          cat "$ARTIFACT_DIR/runner.txt"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.sha }}-android
          path: e2e/artifacts/${{ github.sha }}/android/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # INV-PLAT-02: the native trees are generated, and generated means reproducible.
  #
  # Two halves. (a) Nothing under apps/mobile/ios or apps/mobile/android is tracked —
  # the moment one file is, someone will hand-edit it and `prebuild --clean` will
  # silently delete their work. (b) `expo prebuild` run twice on the same commit
  # produces the same tree — otherwise "generated" is not a property anyone can rely
  # on, and a config-plugin change is indistinguishable from drift.
  #
  # "The same tree" is NOT byte-for-byte, and claiming it would have made this job red
  # on every run. Measured here 2026-09-11: two consecutive prebuilds of this commit
  # agree on 70 files and disagree on one Xcode object id, freshly minted by
  # expo-dev-client's config plugin for its "Strip Local Network Keys" build phase. Ids
  # are arbitrary internal names, so the comparison is up to a consistent renaming of
  # them — see scripts/canonicalise-pbxproj.py, whose --self-test proves that a moved or
  # changed phase is still drift.
  #
  # Runs on Linux: prebuild needs no Xcode, and skipping CocoaPods is what makes the
  # iOS half comparable at all (Podfile.lock resolution is not hermetic).
  # ---------------------------------------------------------------------------
  prebuild-determinism:
    name: INV-PLAT-02 — native trees are generated and reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: No tracked file lives under apps/mobile/ios or apps/mobile/android
        run: |
          set -euo pipefail
          TRACKED=$(git ls-files -- apps/mobile/ios apps/mobile/android)
          if [ -n "$TRACKED" ]; then
            echo "::error::generated native files are committed:" >&2
            echo "$TRACKED" >&2
            exit 1
          fi
          echo "no tracked files under apps/mobile/{ios,android}"

      - name: The pbxproj canonicaliser does what the comparison assumes
        run: python3 scripts/canonicalise-pbxproj.py --self-test

      - name: Prebuild twice and compare tree hashes
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/prebuild"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          prebuild_into () {
            local out="$1"
            rm -rf apps/mobile/ios apps/mobile/android
            # --no-install: the dependency set is already frozen-lockfile installed, and
            # prebuild must not be allowed to touch it (INV-PLAT-01).
            (cd apps/mobile && npx expo prebuild --clean --no-install --platform all)
            mkdir -p "$out"
            for dir in ios android; do
              if [ -d "apps/mobile/$dir" ]; then mv "apps/mobile/$dir" "$out/$dir"; fi
            done
            # Compare up to a consistent renaming of Xcode object ids (see the note above).
            find "$out" -name '*.pbxproj' -exec python3 "$PWD/scripts/canonicalise-pbxproj.py" {} +
          }

          if command -v sha256sum >/dev/null 2>&1; then
            HASHER=(sha256sum)
          else
            HASHER=(shasum -a 256)
          fi

          # The hash covers file CONTENT *and* the sorted list of entries with their
          # types and symlink targets. A changed byte, a renamed file, a vanished
          # symlink and a new empty directory are then all drift — and only the first of
          # those changes any file's bytes.
          #
          # `-exec ... {} +` rather than `xargs`: xargs with an empty list runs the
          # hasher once with no arguments, which reads stdin and hangs the job forever.
          tree_hash () {
            local dir="$1"
            {
              ( cd "$dir" && find . -mindepth 1 | LC_ALL=C sort | while IFS= read -r entry; do
                  if [ -L "$entry" ]; then printf 'l %s -> %s\n' "$entry" "$(readlink "$entry")"
                  elif [ -d "$entry" ]; then printf 'd %s\n' "$entry"
                  else printf 'f %s\n' "$entry"; fi
                done )
              ( cd "$dir" && find . -type f -exec "${HASHER[@]}" {} + | LC_ALL=C sort )
            } | "${HASHER[@]}" | cut -d' ' -f1
          }

          prebuild_into "$WORK/first"
          prebuild_into "$WORK/second"

          FIRST=$(tree_hash "$WORK/first")
          SECOND=$(tree_hash "$WORK/second")
          echo "first  $FIRST"
          echo "second $SECOND"

          if [ "$FIRST" != "$SECOND" ]; then
            echo "::error::expo prebuild is not reproducible on this commit; the native tree drifted between two runs" >&2
            diff -r "$WORK/first" "$WORK/second" | head -100 >&2 || true
            exit 1
          fi
          echo "expo prebuild is reproducible: $FIRST"

      - name: Prebuild left nothing tracked behind
        if: always()
        run: |
          set -euo pipefail
          # `prebuild --clean` regenerates; it must never make the working tree dirty in
          # a way git can see (the generated dirs are .gitignored).
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::prebuild left the working tree dirty:" >&2
            echo "$DIRTY" >&2
            exit 1
          fi
