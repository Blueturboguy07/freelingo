name: cla

# Individual CLA (./CLA.md). A contributor accepts by commenting the sentence below on
# their pull request; the bot records the acceptance in a signatures file on a branch of
# this repository.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA assistant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Blueturboguy07/freelingo/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-notsigned-prweb-comment: >
            Thanks for the pull request. Freelingo keeps two licence promises — AGPL-3.0-only
            for the code and CC BY-NC-SA 4.0 for the content packs — and the CLA is what makes
            them keepable. Please read **[CLA.md](https://github.com/Blueturboguy07/freelingo/blob/main/CLA.md)**
            and, if you agree, post exactly this as a new comment:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
