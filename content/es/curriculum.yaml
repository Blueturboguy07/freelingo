# Freelingo — Spanish (es) course curriculum
#
# ORIGINALLY AUTHORED FOR THIS REPOSITORY. CC BY-NC-SA 4.0 (`../LICENSE`).
# See `README.md` beside this file for the provenance statement and what it is for.
#
# This is input 6 of the language kit (`scope2/00` §2.1): the A1 grammar-concept
# inventory plus the unit titles, the one irreducible human input the corpus cannot
# supply. Nothing here is derived from Cervantes' Plan Curricular, the Council of
# Europe's descriptors, Duolingo's unit titles, or any course, lexicon or corpus.
# It is the language-agnostic template of `scope2/00` §2.2 filled in for Spanish, and
# it is also the D1 tagging contract: `grammar_concept` + `target_lexemes` are exactly
# the tags every generated exercise inherits.
#
# What G3 READS from this file and what G3 DERIVES:
#
#   read      section order, `cefr_prose`, unit order, title, function,
#             grammar_concept, register_slot, target_lexemes, the concept probes
#   derived   unit_index (global), level_count (from the new-item rate),
#             target_lemmas (target_lexemes ∩ the G2 lexicon, budgeted),
#             recycled_lemmas (the recycling schedule V3 checks),
#             section_cefr — the shipped CEFR claim
#
# `section_cefr` is a G3 OUTPUT, not a G2 lookup. The adversarial review's R23 found the
# CEFR claim sourced at the wrong granularity: CEFRLex is a per-lemma lexicon and the
# reference product attaches CEFR to SECTIONS (S023 `{{cefr_level}} • see details`,
# S024 `CEFR {{cefr_level}}` + the prose blurb + the Grammar concepts list). So the
# section label is decided by which grammar concepts a section contains and is then
# CHECKED against the G2 lexicon's bands, never read out of it.
#
# `cefr_prose` values are constrained: only seven prose strings ship, and there is NO A2
# string (deep/03 §review: the contiguous run is str:2325–2331 and `high A1` is
# immediately followed by `early B1`). A section that derived an A2 chip therefore has no
# prose to render, which G3 reports rather than inventing one. This course stops at
# `high A1`, so it never hits that wall — but the rule is enforced, not assumed.

# `forms:` — WHAT THE COURSE TEACHES, AND WHY IT HAS TO BE WRITTEN DOWN (ruling B9(c))
#
# A unit may declare, per lexeme, the surface forms it teaches. G3 lemmatises them with
# the pinned adapter and FAILS THE BUILD naming any target lexeme no form can reach.
# It is not a selector and G4 never sees it; it is a claim about Spanish that the
# lemmatiser can contradict.
#
# It exists because `es_core_news_md` 3.8.0 does not always produce the lemma a reader
# would expect, and until this gate landed the disagreement was SILENT: an unreachable
# lexeme is in no lexicon, so G3 counted it as "deferred" — the same bucket as a good
# lemma this corpus happened not to contain — and the unit shipped teaching one thing
# fewer than it says. Measured on this file before the fix: 92 of 990. After it: 0 of 952.
#
# Every declared form is a real Spanish form of the lexeme and is LOWERCASE — the loader
# refuses a capital and says why. Most are the one-word-document effect the adapter's
# `lemmatise_surface` docstring describes: `trabajo` alone is read as a verb, `trabajos`
# as the noun. **A capitalised form is refused because it is not a repair.** The model
# re-tags a sentence-initial capital PROPN and keeps the surface as the lemma, so
# `Gracias` reaches `gracias` where `gracias` reaches `gracia`: the gate would go green
# for a lexeme that no ordinary corpus sentence can select, which is the exact defect
# this gate exists to catch. An adversarial review found three such rows here
# (`Gracias`, `Media`, `Paraguas`) and they are gone: the position artefact belongs in
# `config/g1.LEMMA_NORMALISATION_ES`, whose whole job is to make the two positions agree.
#
# SO THERE ARE THREE LEVERS, AND WHICH ONE TO PULL IS DECIDED BY D-B9A-01 IN THAT FILE:
#
#   1. `forms:` — the bare surface mis-lemmatises but another real lowercase form of the
#      same word does not (`trabajos` for `trabajo`, `primas` for `prima`). 38 rows.
#   2. A normalisation-table row — no lowercase form works, and the raw lemma the model
#      produces is not itself a Spanish word the course could mean (`cucharo` -> `cuchara`,
#      `paragua` -> `paraguas`, `to` -> `tos`).
#   3. **Declare the lemma the model produces** — the raw lemma IS a Spanish headword, so
#      a table row would fold a real word into another ledger item: `gracias` -> `gracia`
#      (u1), `media` -> `medio` (u13), `resta` -> `restar` (u26). The ledger item is what
#      the lemmatiser's partition calls it; the learner still sees "gracias".
#
# AND WHERE NO LEVER WORKS, THE DECLARATION WAS REMOVED, because the model MERGES these
# rather than spelling them differently and a table cannot re-split a merge:
#
#   * subject and object pronouns the lemmatiser collapses — `ella`, `nosotros`, `ellos`
#     (u1) and `lo`, `me`, `te`, `nos`, `os`, `se` (u28) all lemmatise to `él`, `yo` or
#     `tú`, which the frozen self-test has recorded since P2 round 1;
#   * reflexive infinitives — `llamarse` (u1), `encontrarse` (u15), `equivocarse` (u20),
#     `dirigirse` (u23) and the whole of u21 give `<verb> él`, a two-word lemma, and the
#     same one for `-lo`/`-la`/`-le`, so it identifies no verb;
#   * the locative `fuera` (u7) -> `ser`: it is spelled like the imperfect subjunctive of
#     `ser`/`ir`, so the adverb pair is taught with `afuera`, which the model does produce;
#   * `vacaciones` (u24) -> `vacación`, `un` (u30) -> `uno` (already taught in u2).
#
# Nothing is lost pedagogically: these constructions are taught by their GRAMMAR
# CONCEPT, and Q2 option C (`scope2/00`) schedules a grammar concept as a ledger item of
# its own. What is removed is the claim that the pronoun or the reflexive infinitive is a
# separate LEMMA, which the ledger cannot hold. u21 now declares the twelve base verbs
# the lemmatiser does produce for what the learner says ("se levanta" -> `levantar`);
# its title, function and `reflexive_daily_routine` probe are unchanged, and the probe
# matches the clitic, not the verb.
#
schema: 1
lang: es
l1: en
licence: CC-BY-NC-SA-4.0
authored_for: freelingo
authored_on: 2026-09-12
originality: >-
  Every unit title, function label, grammar-concept label and lexeme list below was
  written for this repository. No national inventory, syllabus, course or commercial
  reference was copied or paraphrased. Facts and levels are not protectable; specific
  wording is, so none was taken.

# ---------------------------------------------------------------------------
# The A1 grammar-concept inventory — 30 concepts.
# ---------------------------------------------------------------------------
#
# `probe` is how G4 decides whether a corpus sentence EXHIBITS the concept. A sentence
# exhibits it when at least one analysed token satisfies every clause that is present:
#
#   lemma_any    the token's lemma is one of these
#   pos_any      the token's UD POS tag is one of these
#   morph_any    the token's morph bundle contains at least one of these features
#   morph_all    the token's morph bundle contains all of these features
#   suffix_any   the token's lemma ends with one of these
#
# A probe with no clause at all is refused by the loader: it would match every sentence
# and make the grammar-concept constraint vacuous, which is the failure mode that looks
# exactly like a working selector.

grammar_concepts:
  - id: subject_pronouns
    label: Subject pronouns and who is speaking
    cefr: A1
    probe:
      pos_any: [PRON]
      morph_any: [PronType=Prs]

  - id: numbers_quantity
    label: Cardinal numbers and saying how many
    cefr: A1
    probe:
      pos_any: [NUM]

  - id: ser_identity
    label: Ser for identity, origin and what something is
    cefr: A1
    probe:
      lemma_any: [ser]
      pos_any: [AUX, VERB]

  - id: definite_articles
    label: Definite articles and the gender of nouns
    cefr: A1
    probe:
      pos_any: [DET]
      morph_any: [Definite=Def]

  - id: possessive_adjectives
    label: Possessive adjectives before a noun
    cefr: A1
    probe:
      pos_any: [DET, PRON]
      morph_any: [Poss=Yes]

  - id: tener_possession
    label: Tener for what you have and how old you are
    cefr: A1
    probe:
      lemma_any: [tener]
      pos_any: [VERB]

  - id: question_words
    label: Question words that open a request for information
    cefr: A1
    probe:
      morph_any: [PronType=Int]

  - id: adjective_agreement
    label: Adjectives agreeing in gender and number
    cefr: A1
    probe:
      pos_any: [ADJ]
      morph_any: [Gender=Fem, Gender=Masc]

  - id: querer_poder_modals
    label: Querer and poder followed by an infinitive
    cefr: A1
    probe:
      lemma_any: [querer, poder]
      pos_any: [VERB, AUX]

  - id: estar_state_location
    label: Estar for where something is and how it is right now
    cefr: A1
    probe:
      lemma_any: [estar]
      pos_any: [AUX, VERB]

  - id: present_ar_verbs
    label: Present tense of verbs ending in -ar
    cefr: A1
    probe:
      pos_any: [VERB]
      morph_all: [Tense=Pres]
      suffix_any: [ar]

  - id: present_er_ir_verbs
    label: Present tense of verbs ending in -er and -ir
    cefr: A1
    probe:
      pos_any: [VERB]
      morph_all: [Tense=Pres]
      suffix_any: [er, ir]

  - id: hay_existence
    label: Hay for saying something exists
    cefr: A1
    probe:
      lemma_any: [haber]
      pos_any: [VERB, AUX]

  - id: gustar_liking
    label: Gustar and the person who does the liking
    cefr: A1
    probe:
      lemma_any: [gustar, encantar, interesar, importar, molestar]

  - id: prepositions_place
    label: Prepositions that place one thing next to another
    cefr: A1
    probe:
      pos_any: [ADP, ADV]
      lemma_any:
        [
          en,
          sobre,
          bajo,
          entre,
          cerca,
          lejos,
          dentro,
          fuera,
          junto,
          detrás,
          delante,
          encima,
          debajo,
        ]

  - id: time_expressions
    label: Saying the time, the day and how often
    cefr: A1
    probe:
      lemma_any:
        [
          hora,
          día,
          semana,
          lunes,
          martes,
          miércoles,
          jueves,
          viernes,
          sábado,
          domingo,
          siempre,
          nunca,
          hoy,
          mañana,
          ayer,
        ]

  - id: weather_impersonal
    label: Impersonal weather expressions
    cefr: A1
    probe:
      lemma_any: [hacer, llover, nevar, sol, lluvia, nieve, viento, calor, frío]

  - id: noun_number_agreement
    label: Plural nouns and the words that agree with them
    cefr: A1
    probe:
      pos_any: [NOUN]
      morph_all: [Number=Plur]

  - id: ir_a_future
    label: Ir a plus an infinitive for what you are going to do
    cefr: A1
    probe:
      lemma_any: [ir]
      pos_any: [VERB, AUX]

  - id: negation_no
    label: Saying no, and the words that go with it
    cefr: A1
    probe:
      pos_any: [ADV, PRON, DET]
      lemma_any: ['no', nada, nadie, ninguno, nunca, jamás, ni, tampoco]

  - id: reflexive_daily_routine
    label: Reflexive verbs for what you do to yourself
    cefr: A1
    probe:
      pos_any: [PRON]
      morph_any: [Reflex=Yes]

  - id: demonstratives
    label: This, that and the one over there
    cefr: A1
    probe:
      morph_any: [PronType=Dem]

  - id: formal_informal_address
    label: Choosing between the familiar and the polite you
    cefr: A1
    probe:
      pos_any: [PRON, DET, VERB]
      morph_any: [Person=2, Polite=Form]

  - id: contractions_al_del
    label: The two contractions, al and del
    cefr: A1
    probe:
      pos_any: [ADP]
      lemma_any: [a, de]

  - id: estar_gerund
    label: Estar plus a gerund for what is happening now
    cefr: A1
    probe:
      pos_any: [VERB, AUX]
      morph_any: [VerbForm=Ger]

  - id: stem_changing_verbs
    label: Verbs whose stem vowel changes in the present
    cefr: A1
    probe:
      pos_any: [VERB]
      lemma_any:
        [
          pensar,
          perder,
          dormir,
          jugar,
          soñar,
          recordar,
          mostrar,
          encender,
          contar,
          volver,
          empezar,
          cerrar,
          entender,
          preferir,
          servir,
          pedir,
          repetir,
          probar,
        ]

  - id: comparatives_basic
    label: Comparing two things with más, menos and tan
    cefr: A1
    probe:
      pos_any: [ADV, ADJ, SCONJ]
      lemma_any: [más, menos, tan, tanto, como, mejor, peor, mayor, menor]

  - id: direct_object_pronouns
    label: Replacing the thing acted on with a pronoun
    cefr: A1
    probe:
      pos_any: [PRON]
      morph_any: [Case=Acc, PrepCase=Npr]

  - id: yes_no_questions
    label: Questions answered with yes or no
    cefr: A1
    probe:
      pos_any: [PUNCT, VERB, AUX]
      lemma_any: ['¿', '?', ser, estar, tener, querer, poder]

  - id: indefinite_articles
    label: Indefinite articles, and one of something
    cefr: A1
    probe:
      pos_any: [DET]
      morph_any: [Definite=Ind]

# ---------------------------------------------------------------------------
# Sections and units.
# ---------------------------------------------------------------------------
#
# Three sections, thirty units, ~990 target lexemes — the A1 half of an eight-section
# course. Sections 4-8 are authored with the A2/B1/B2 kits and are deliberately absent
# rather than stubbed: an empty section renders a real screen (S023 shows FUTURE
# sections) and a stub would ship a can-do promise nobody wrote.
#
# `cefr_prose` walks the three A1 rungs of the shipped prose ladder. There is no
# positional section→CEFR rule here: deep/03's review measured the labels against Score
# bands, not against section index, and the German course ships six sections. G3 derives
# the chip from the concepts and checks the declared prose against it.

