// P5 widget deps task, 2026-09-13. Kotlin matches the installed Expo/RN root build.
buildscript {
  if (!rootProject.ext.has('kotlinVersion')) {
    throw new GradleException('The Expo root Kotlin version must be configured before widget-publication')
  }
  ext.widgetKotlinVersion = rootProject.ext.kotlinVersion
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${widgetKotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.widgetpublication'
version = '0.1.0'

android {
  namespace 'expo.modules.widgetpublication'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'androidx.glance:glance-appwidget:1.2.0'
  implementation 'androidx.datastore:datastore-preferences:1.1.7'
}
