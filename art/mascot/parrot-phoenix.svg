<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Freelingo parrot — phoenix</title>
  <desc>Original work for Freelingo (AGPL-3.0). The S075 streak-milestone form: the same
  parrot silhouette in the streak palette, with flame crest, flame wings and a flame tail.
  Streak orange and gold are the measured tokens; the ember red is the hearts red, used
  only here.</desc>

  <!-- flame tail: it has to clear the body (which reaches y=206) by enough to read at
       64 px, so the plume sits low and the two side licks swing wide -->
