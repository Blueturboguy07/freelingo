<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Freelingo parrot — cheer</title>
  <desc>Original work for Freelingo (AGPL-3.0). Wings thrown above the head, beak wide
  open, crest fanned, three sparkles. Distinguished from happy by silhouette, not by
  expression: at 64 px the raised-wing outline is what a reader actually picks up.</desc>

  <ellipse cx="120" cy="216" rx="14" ry="28" fill="#00CD9C" transform="rotate(-38 120 188)"/>
  <ellipse cx="120" cy="216" rx="14" ry="28" fill="#CE82FF" transform="rotate(38 120 188)"/>
  <ellipse cx="120" cy="218" rx="15" ry="29" fill="#49C0F8"/>

  <!-- wings up, behind the body so the shoulders read clean -->
  <ellipse cx="40" cy="92" rx="18" ry="42" fill="#58A700" transform="rotate(-46 56 122)"/>
  <ellipse cx="200" cy="92" rx="18" ry="42" fill="#58A700" transform="rotate(46 184 122)"/>

  <!-- crest fanned -->
  <ellipse cx="88" cy="48" rx="11" ry="22" fill="#FFC700" transform="rotate(-48 88 64)"/>
  <ellipse cx="152" cy="48" rx="11" ry="22" fill="#FFC700" transform="rotate(48 152 64)"/>
  <ellipse cx="120" cy="32" rx="12" ry="24" fill="#FFC700"/>

  <path d="M120 54 C164 54 192 90 192 128 C192 174 160 204 120 204 C80 204 48 174 48 128 C48 90 76 54 120 54 Z" fill="#58CC02"/>
  <ellipse cx="120" cy="162" rx="41" ry="36" fill="#72D627"/>

  <rect x="86" y="202" width="28" height="17" rx="7" fill="#FFAB33"/>
  <rect x="126" y="202" width="28" height="17" rx="7" fill="#FFAB33"/>

  <!-- eyes wide -->
  <circle cx="96" cy="102" r="25" fill="#FFFFFF"/>
  <circle cx="144" cy="102" r="25" fill="#FFFFFF"/>
  <circle cx="98" cy="99" r="12" fill="#3C3C3C"/>
  <circle cx="142" cy="99" r="12" fill="#3C3C3C"/>

  <!-- beak wide open -->
  <ellipse cx="120" cy="158" rx="23" ry="20" fill="#3C3C3C"/>
  <path d="M98 124 L142 124 C142 142 133 152 120 152 C107 152 98 142 98 124 Z" fill="#FFAB33"/>
  <path d="M102 166 C108 158 132 158 138 166 C138 182 130 190 120 190 C110 190 102 182 102 166 Z" fill="#E08A00"/>

  <!-- sparkles -->
  <polygon points="26,58 33,76 51,83 33,90 26,108 19,90 1,83 19,76" fill="#FFC700"/>
  <polygon points="214,58 221,76 239,83 221,90 214,108 207,90 189,83 207,76" fill="#FFC700"/>
  <polygon points="120,6 126,20 140,26 126,32 120,46 114,32 100,26 114,20" fill="#FFC700"/>
</svg>
